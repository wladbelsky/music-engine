<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Music Engine</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas, #glow { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; }
  #glow { pointer-events: none; opacity: 0; mix-blend-mode: screen; }
  #dash { pointer-events: none; }
  #debug { position: absolute; left: 10px; bottom: 10px; display: none; margin: 0; padding: 8px 10px;
    font: 12px/1.4 Consolas, monospace; color: #9fe; background: rgba(0,0,0,.6); border-radius: 6px; white-space: pre; pointer-events: none; }
  /* settings panel (browser only): a full-height sidebar of collapsible cards, one control per row */
  #devpanel { position: absolute; left: 0; top: 0; bottom: 0; width: min(360px, 100vw); box-sizing: border-box; display: none;
    background: rgba(12,13,15,.93); color: #ccd; font: 13px "Segoe UI", Arial, sans-serif; border-right: 1px solid #2a2d31;
    z-index: 5; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: #3a3f45 transparent; }
  #devpanel .head { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; justify-content: space-between;
    padding: 10px 12px; background: rgba(16,17,20,.97); border-bottom: 1px solid #2a2d31; }
  #devpanel .head b { color: #fff; font-size: 15px; letter-spacing: .04em; }
  #devpanel .grp { margin: 10px 10px 0; background: rgba(255,255,255,.03); border: 1px solid #25282c; border-radius: 8px; }
  #devpanel summary { padding: 8px 10px; cursor: pointer; color: #fff; font-weight: 600; font-size: 12px; letter-spacing: .08em;
    text-transform: uppercase; user-select: none; list-style: none; display: flex; align-items: center; gap: 6px; }
  #devpanel summary::-webkit-details-marker { display: none; }
  #devpanel summary::before { content: '▸'; color: #ff5a1a; transition: transform .15s; }
  #devpanel .grp[open] > summary::before { transform: rotate(90deg); }
  #devpanel .body { padding: 2px 10px 10px; display: flex; flex-direction: column; gap: 8px; }
  #devpanel .row { display: grid; grid-template-columns: 8.5em 1fr; align-items: center; gap: 8px; min-height: 26px; }
  #devpanel .row > span { opacity: .8; }
  #devpanel .row > .ctl { display: flex; align-items: center; gap: 8px; min-width: 0; }
  #devpanel .row:has(:disabled) { opacity: .4; }
  #devpanel .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  #devpanel .btn { text-align: center; }
  #devpanel .foot { padding: 12px 10px; }
  #dv-show { position: absolute; left: 10px; top: 10px; display: none; z-index: 5; padding: 3px 9px; opacity: .55;
    background: rgba(12,13,15,.85); color: #ccd; font: 12px "Segoe UI", Arial, sans-serif; border: 1px solid #2a2d31; border-radius: 6px; cursor: pointer; }
  #dv-show:hover { opacity: 1; }
  #devpanel .val { min-width: 2.8em; text-align: right; opacity: .7; font-variant-numeric: tabular-nums; }
  #devpanel input[type=color] { width: 2.6em; height: 1.6em; padding: 0; border: 1px solid #3a3f45; background: none; }
  #devpanel input[type=range] { flex: 1; min-width: 0; margin: 0; accent-color: #ff5a1a; }
  #devpanel input[type=checkbox] { width: 16px; height: 16px; margin: 0; accent-color: #ff5a1a; }
  #devpanel select, #devpanel input[type=number] { flex: 1; min-width: 0; }
  #devpanel button, #devpanel .btn, #devpanel select, #devpanel input[type=number] { background: #1d2024; color: #dde; border: 1px solid #3a3f45;
    border-radius: 4px; padding: 4px 9px; font: inherit; cursor: pointer; }
  #devpanel button:hover, #devpanel .btn:hover { border-color: #5a6068; }
  #devpanel input[type=file] { display: none; }
  /* file player: shown while a file is the audio source */
  #dv-player { display: flex; flex-direction: column; gap: 6px; padding: 8px; background: rgba(0,0,0,.25); border-radius: 6px; }
  #dv-player[hidden] { display: none; }
  #dv-player .ctl { display: flex; align-items: center; gap: 8px; }
  #dv-play { width: 32px; height: 28px; padding: 0; flex: none; }
  #dv-time { opacity: .7; font-variant-numeric: tabular-nums; white-space: nowrap; }
  #dv-track { opacity: .8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* splash: plain HTML/CSS, painted with the first frame of the page (before the scripts run);
     main.js fades it out once the user's engine has rendered */
  #splash { position: absolute; inset: 0; z-index: 10; pointer-events: none; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 4vmin; background: radial-gradient(ellipse at 50% 45%, #1d1f24 0%, #0f1013 55%, #070708 100%);
    transition: opacity .5s ease-out; }
  #splash.gone { opacity: 0; }
  #splash .dial { position: relative; width: 30vmin; height: 30vmin; filter: drop-shadow(0 0 3vmin rgba(255, 90, 26, .12)); }
  #splash svg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  #splash text { font: 700 15px "Segoe UI", Arial, sans-serif; text-anchor: middle; }
  #splash .needle { position: absolute; left: 0; top: 0; width: 100%; height: 100%; will-change: transform;
    transform: rotate(-128deg); animation: sp-rev 2.6s ease-in-out infinite; }
  #splash .name { color: #ff5a1a; font: 600 3.2vmin "Segoe UI", Arial, sans-serif; letter-spacing: .55em; margin-right: -.55em;
    text-shadow: 0 0 1.2vmin rgba(255, 90, 26, .45); position: relative; }
  /* the dots hang off the right edge, so LOADING itself stays centred under the dial */
  #splash .dots { position: absolute; left: 100%; top: 0; letter-spacing: .25em; }
  #splash .dots i { font-style: normal; opacity: .15; will-change: opacity; animation: sp-dot 1.2s linear infinite; }
  #splash .dots i:nth-child(2) { animation-delay: .2s; } #splash .dots i:nth-child(3) { animation-delay: .4s; }
  @keyframes sp-dot { 0%, 60%, 100% { opacity: .15; } 15%, 40% { opacity: 1; } }
  /* ignition sweep into the red, back to idle, a blip */
  @keyframes sp-rev { 0% { transform: rotate(-128deg); } 22% { transform: rotate(100deg); } 30% { transform: rotate(88deg); }
    55% { transform: rotate(-108deg); } 70% { transform: rotate(-40deg); } 86%, 100% { transform: rotate(-128deg); } }
  @media (orientation: portrait) { #splash .dial { width: 44vmin; height: 44vmin; } #splash .name { font-size: 4.4vmin; } }
  @media (prefers-reduced-motion: reduce) { #splash .needle { animation: none; transform: rotate(-108deg); } #splash .dots i { animation: none; opacity: 1; } }
</style>
</head>
<body>
<div id="splash">
  <div class="dial">
    <svg viewBox="0 0 200 200">
      <circle cx="100" cy="100" r="94" fill="#101114" stroke="#a7adb4" stroke-width="6"/>
      <path d="M46.3 153.7A76 76 0 1 1 170.2 70.9" fill="none" stroke="#e8e8e8" stroke-width="3"/>
      <path d="M170.2 70.9A76 76 0 0 1 153.7 153.7" fill="none" stroke="#e0241b" stroke-width="9"/>
      <path d="M46.3 153.7L54.7 145.3M39.0 145.3L43.8 141.7M33.0 135.8L38.3 133.0M28.4 125.6L34.1 123.6M25.5 114.8L37.2 112.5M24.1 103.7L30.1 103.4M24.4 92.6L30.3 93.1M26.3 81.5L32.1 83.0M29.8 70.9L40.9 75.5M34.8 60.9L40.0 64.0M41.3 51.8L45.9 55.6M49.0 43.7L53.0 48.1M57.8 36.8L64.4 46.8M67.5 31.3L70.1 36.7M77.9 27.3L79.7 33.0M88.8 24.8L89.7 30.8M100.0 24.0L100.0 36.0M111.2 24.8L110.3 30.8M122.1 27.3L120.3 33.0M132.5 31.3L129.9 36.7M142.2 36.8L135.6 46.8M151.0 43.7L147.0 48.1M158.7 51.8L154.1 55.6M165.2 60.9L160.0 64.0M170.2 70.9L159.1 75.5M173.7 81.5L167.9 83.0M175.6 92.6L169.7 93.1M175.9 103.7L169.9 103.4M174.5 114.8L162.8 112.5M171.6 125.6L165.9 123.6M167.0 135.8L161.7 133.0M161.0 145.3L156.2 141.7M153.7 153.7L145.3 145.3" stroke="#e8e8e8" stroke-width="2"/>
      <text x="63.2" y="141.8" fill="#d8d8d8">0</text><text x="49.0" y="115.1" fill="#d8d8d8">1</text><text x="52.0" y="85.1" fill="#d8d8d8">2</text>
      <text x="71.1" y="61.8" fill="#d8d8d8">3</text><text x="100.0" y="53.0" fill="#d8d8d8">4</text><text x="128.9" y="61.8" fill="#d8d8d8">5</text>
      <text x="148.0" y="85.1" fill="#ff4a3a">6</text><text x="151.0" y="115.1" fill="#ff4a3a">7</text><text x="136.8" y="141.8" fill="#ff4a3a">8</text>
    </svg>
    <svg class="needle" viewBox="0 0 200 200"><path d="M97 116 L100 26 L103 116 Z" fill="#ff5a1f"/></svg>
    <svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="11" fill="#2a2d31" stroke="#a7adb4" stroke-width="3"/></svg>
  </div>
  <div class="name">LOADING<span class="dots"><i>.</i><i>.</i><i>.</i></span></div>
</div>
<canvas id="bg"></canvas>
<div id="glow"></div>
<canvas id="gl"></canvas>
<canvas id="dash"></canvas>
<pre id="debug"></pre>

<button id="dv-show" title="Show settings (D)">Settings ▸</button>
<div id="devpanel">
  <div class="head"><b>Settings</b><button id="dv-hide" title="Hide (D toggles)">Hide ◂</button></div>
  <details class="grp" open><summary>Audio</summary><div class="body">
    <div class="btns">
      <button id="dv-demo">Demo beat</button><button id="dv-mic">Microphone</button>
      <label class="btn">Open file…<input id="dv-file" type="file" accept="audio/*"></label><button id="dv-stop">Stop</button></div>
    <div id="dv-player" hidden>
      <div id="dv-track"></div>
      <div class="ctl"><button id="dv-play" title="Play / pause">❚❚</button><input id="dv-seek" type="range" min="0" max="0" step="0.1" value="0"><span id="dv-time">0:00 / 0:00</span></div>
    </div>
  </div></details>
  <div id="dv-props"></div>
  <details class="grp" open><summary>Odometer</summary><div class="body">
    <div class="btns"><button id="dv-trip">Reset trip</button><button id="dv-odo0">Reset ODO</button></div>
  </div></details>
  <div class="foot"><button id="dv-reset" title="Forget the saved settings (mileage stays)">Reset settings</button></div>
</div>

<script src="js/three.min.js"></script>
<script src="js/core/audio.js"></script>
<script src="js/core/sim.js"></script>
<script src="js/core/fx.js"></script>
<script src="js/core/engine3d.js"></script>
<script src="js/core/layout.js"></script>
<script src="js/engines/piston.js"></script>
<script src="js/engines/piston-layouts.js"></script>
<script src="js/engines/steam.js"></script>
<script src="js/engines/jet.js"></script>
<script src="js/engines/electric.js"></script>
<script src="js/engines/marine.js"></script>
<script src="js/engines/rocket.js"></script>
<script src="js/engines/induction.js"></script>
<script src="js/core/dash.js"></script>
<script src="js/core/bg.js"></script>
<script src="js/core/media.js"></script>
<script src="js/core/odometer.js"></script>
<script src="js/main.js"></script>
</body>
</html>
